<div class="min-h-[85vh] flex items-center justify-center px-4 py-12 bg-white relative overflow-hidden">
  <!-- Decorative solid shapes -->
  <div class="absolute -top-20 -right-20 w-72 h-72 rounded-3xl bg-[#fff8e1] pointer-events-none" aria-hidden="true"></div>
  <div class="absolute -bottom-24 -left-24 w-80 h-80 rounded-3xl bg-[#fef2f2] pointer-events-none" aria-hidden="true"></div>

  <div class="relative card p-8 md:p-10 w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-display font-bold text-[#171717]">Crear cuenta</h1>
      <p class="mt-2 text-sm text-[#737373]">Únete a Restaurante y descubre una nueva forma de ordenar</p>
    </div>

    @if (error) {
      <div class="mb-6 p-4 rounded-xl bg-red-50 border border-red-200 flex items-start gap-3">
        <svg class="w-5 h-5 text-red-400 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <p class="text-sm text-red-600">{{ error }}</p>
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label for="name" class="label">Nombre</label>
        <input id="name" type="text" [(ngModel)]="name" name="name" required
          class="input"
          placeholder="Tu nombre">
      </div>

      <div>
        <label for="email" class="label">Correo electrónico</label>
        <input id="email" type="email" [(ngModel)]="email" name="email" required
          class="input"
          placeholder="tu@correo.com">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="password" class="label">Contraseña</label>
          <input id="password" type="password" [(ngModel)]="password" name="password" required
            class="input"
            placeholder="••••••••">
        </div>
        <div>
          <label for="confirmPassword" class="label">Confirmar contraseña</label>
          <input id="confirmPassword" type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required
            class="input"
            placeholder="••••••••">
        </div>
      </div>

      <div>
        <label for="phone" class="label">Teléfono</label>
        <input id="phone" type="tel" [(ngModel)]="phone" name="phone" required
          class="input"
          placeholder="+52 555 123 4567">
      </div>

      <div>
        <label class="label">Tipo de cuenta</label>
        <div class="flex gap-2 p-1 bg-[#fafafa] rounded-full">
          <button type="button" (click)="role='customer'"
            class="chip flex-1"
            [class.chip-active]="role === 'customer'">
            Cliente
          </button>
          <button type="button" (click)="role='restaurant'"
            class="chip flex-1"
            [class.chip-active]="role === 'restaurant'">
            Restaurante
          </button>
        </div>
      </div>

      <button type="submit" [disabled]="loading"
        class="btn btn-primary btn-lg w-full">
        @if (loading) {
          <span class="inline-flex items-center gap-2">
            <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
            Creando cuenta...
          </span>
        } @else {
          Crear cuenta
        }
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-gray-500">
      ¿Ya tienes cuenta?
      <a routerLink="/auth/login" class="text-[#e11d2e] font-medium hover:text-[#b91c1c]">Inicia sesión</a>
    </p>
  </div>
</div>
